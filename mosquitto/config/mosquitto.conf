# =============================================================================
# Eclipse Mosquitto configuration — IOT // DASHBOARD
#
#   listener 1883  MQTT      (devices, Node backend, ESP32/ESP8266)
#   listener 9001  WebSockets (browser clients)
#
# Anonymous access is enabled because this broker is meant for a trusted,
# private LAN. FOR ANY EXPOSED / INTERNET-FACING DEPLOYMENT:
#   1. set `allow_anonymous false`
#   2. create a password file:  mosquitto_passwd -c /mosquitto/config/passwd <user>
#   3. add: password_file /mosquitto/config/passwd
#   4. set MQTT_USERNAME / MQTT_PASSWORD for the node-server service
# =============================================================================

# --- Broker identity ---------------------------------------------------------
per_listener_settings false

# --- MQTT listener -----------------------------------------------------------
listener 1883
protocol mqtt

# --- WebSockets listener -----------------------------------------------------
listener 9001
protocol websockets

# --- Access control ----------------------------------------------------------
allow_anonymous true

# --- Message limits (tuned for 200+ low-power nodes) --------------------------
max_connections -1
max_queued_messages 10000
max_inflight_messages 40
message_size_limit 32768
persistent_client_expiration 2d

# --- Persistence (survives broker restarts; backed by a docker volume) -------
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# --- Logging -----------------------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
